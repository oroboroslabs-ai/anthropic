<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reality Brokers — X banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050506; --ink: #F4F3EF; --muted: #A9A6A0; --dim: #726F68;
    --line: rgba(255,255,255,.11); --line2: rgba(255,255,255,.20); --ice: #D3E2EE;
    --display: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'Source Code Pro', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1500px; height: 500px; overflow: hidden; background: var(--bg); color: var(--ink); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  .banner {
    position: relative; width: 1500px; height: 500px; overflow: hidden; isolation: isolate;
    background-color: #050506;
    background-image:
      radial-gradient(720px 600px at 76% 30%, rgba(200,220,235,.07), transparent 66%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: auto, 84px 84px, 84px 84px;
  }

  /* right-side star shine */
  .shine {
    position: absolute; right: -40px; top: 50%; width: 640px; height: 640px;
    transform: translateY(-50%); z-index: 1; pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,.16) 0%, rgba(211,226,238,.06) 34%, transparent 66%);
    filter: blur(8px);
  }
  .streak {
    position: absolute; right: 150px; top: 36%; width: 390px; height: 1px; z-index: 2;
    transform: translateY(-50%) rotate(-8deg); transform-origin: right center;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    opacity: .5;
  }
  .star {
    position: absolute; right: 22px; top: 47%; width: 44px; height: 44px; z-index: 3;
    transform: translateY(-56%); color: #FFFFFF;
    filter: drop-shadow(0 0 14px rgba(127,211,255,.6));
    animation: twinkle 4.6s ease-in-out infinite;
  }
  .star img { display: block; width: 100%; height: 100%; }
  @keyframes twinkle {
    0%, 100% { opacity: .45; transform: translateY(-56%) scale(.9) rotate(-4deg); }
    50% { opacity: 1; transform: translateY(-56%) scale(1.08) rotate(4deg); }
  }

  .label {
    position: absolute; left: 97px; top: 38px; z-index: 5;
    display: flex; align-items: center; justify-content: flex-start; gap: 12px; margin: 0; 
    color: #F4F3EF; font: 400 24px/1 var(--display);
    letter-spacing: .04em; text-transform: uppercase;
  }

  .center { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-48%); z-index: 4; }
  .line { width: 1306px; margin: 0 auto; display: flex; align-items: center; min-height: 128px; }
  h1 {
    margin: 0; font: 400 132px/.86 var(--display); letter-spacing: -.055em; word-spacing: 1.02ch; text-transform: uppercase;
    color: var(--ink); white-space: nowrap;
    text-shadow: 0 30px 90px rgba(0,0,0,.5);
  }
  .cursor { display: inline-block; width: 9px; height: 96px; margin-left: 12px; background: var(--ink); opacity: 0; }
  .cursor.on { opacity: 1; }
  .sub {
    margin: 22px 0 0 97px; text-align: left; color: var(--dim);
    font: 500 9.5px/1.4 var(--mono); letter-spacing: .2em; text-transform: uppercase;
    opacity: 0; transition: opacity .5s ease;
  }
  .sub.on { opacity: 1; }

  /* glass name chips */
  .chip {
    position: absolute; z-index: 5; display: inline-flex; align-items: center; gap: 8px;
    padding: 0; border: 0; background: none; box-shadow: none;
    color: #FFFFFF; font: 600 9px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
    white-space: nowrap;
  }
  .chip span { color: #A9A6A0; }
  .chip::before { content: ''; width: 10px; height: 1px; background: rgba(255,255,255,.45); }
  .chip.tr { right: 64px; top: 62px; }
  .chip.bl { left: 64px; bottom: 44px; }
  .chip.br { right: 64px; bottom: 44px; }

  .sigil { position: absolute; left: 58px; top: 48px; width: 17px; height: 17px; z-index: 5; opacity: .8; }
  .sigil img { display: block; width: 100%; height: 100%; }

  .flash { position: absolute; inset: 0; z-index: 9; background: #FFFFFF; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="banner">
  <div class="shine"></div>
  <div class="streak"></div>
  <div class="star"><img src="reality-brokers-mark.svg" alt=""></div>

  <p class="label">Glasswing / Field Division</p>
  <div class="sigil"><img src="reality-brokers-mark.svg" alt="Reality Brokers"></div>

  <p style="position:absolute; left:97px; top:92px; z-index:5; margin:0; color:#F4F3EF; font:400 66px/1 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif; letter-spacing:-.01em; text-transform:uppercase;">THE</p>
  <div class="center">
    <div class="line"><h1><span id="typed"></span><span class="cursor" id="cursor"></span></h1></div>
  </div>


  <div class="flash" id="flash"></div>
</div>

<script>
(function () {
  var text = 'REALITY BROKERS';
  var typed = document.getElementById('typed');
  var cursor = document.getElementById('cursor');
  var flash = document.getElementById('flash');
  var start = 0;
  var TYPE_START = 0.35, TYPE_DUR = 1.35;
  var HOLD_END = 26.4, FLASH_DUR = 0.7, TOTAL = 27.4;

  function frame(now) {
    if (!start) start = now;
    var t = ((now - start) / 1000) % TOTAL;

    var p = Math.max(0, Math.min(1, (t - TYPE_START) / TYPE_DUR));
    var n = Math.floor(p * text.length);
    typed.textContent = text.slice(0, n);

    var typing = t > TYPE_START && t < TYPE_START + TYPE_DUR;
    var blink = Math.floor(t * 2) % 2 === 0;
    cursor.classList.toggle('on', typing || (t < HOLD_END && blink));

    if (t > HOLD_END && t < HOLD_END + FLASH_DUR) {
      var f = (t - HOLD_END) / FLASH_DUR;
      flash.style.opacity = String(Math.sin(Math.PI * f) * 0.92);
    } else {
      flash.style.opacity = '0';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__setTime = function (seconds) {
    start = performance.now() - seconds * 1000;
    frame(performance.now());
  };
})();
</script>
</body>
</html>
