<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reality Brokers — X banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050506; --ink: #F4F3EF; --muted: #A9A6A0; --dim: #726F68;
    --line: rgba(255,255,255,.11); --ice: #D3E2EE;
    --tech: 'Chakra Petch', 'Segoe UI', sans-serif;
    --mono: 'Source Code Pro', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1500px; height: 500px; overflow: hidden; background: var(--bg); color: var(--ink); }
  body { font-family: var(--mono); -webkit-font-smoothing: antialiased; }

  .banner {
    position: relative; width: 1500px; height: 500px; overflow: hidden; isolation: isolate;
    background-color: #050506;
    background-image:
      radial-gradient(760px 560px at 80% 22%, rgba(200,220,235,.10), transparent 64%),
      radial-gradient(600px 460px at 8% 90%, rgba(120,150,190,.07), transparent 70%),
      linear-gradient(rgba(255,255,255,.032) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.032) 1px, transparent 1px),
      repeating-conic-gradient(rgba(255,255,255,.014) 0% 25%, transparent 0% 50%);
    background-size: auto, auto, 84px 84px, 84px 84px, 20px 20px;
  }
  .banner::after {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(125% 100% at 50% 50%, transparent 46%, rgba(0,0,0,.62) 100%);
  }

  .copy { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); z-index: 3; }
  .label {
    display: flex; align-items: center; gap: 12px; margin: 0 0 22px;
    color: var(--muted); font: 600 11px/1.2 var(--mono); letter-spacing: .22em; text-transform: uppercase;
  }
  .label::before { content: ''; width: 30px; height: 1px; background: rgba(255,255,255,.24); }

  h1 {
    margin: 0; display: flex; align-items: center;
    font: 700 88px/.92 var(--tech); letter-spacing: .015em; text-transform: uppercase;
    color: #FFFFFF; white-space: nowrap;
    text-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 28px rgba(211,226,238,.10);
    min-height: 96px;
  }
  .cursor {
    display: inline-block; width: 10px; height: 74px; margin-left: 10px;
    background: var(--ice); opacity: 0; box-shadow: 0 0 18px rgba(211,226,238,.55);
  }
  .cursor.on { opacity: 1; }

  .sub {
    margin: 20px 0 0; color: var(--dim); font: 500 10.5px/1.4 var(--mono);
    letter-spacing: .2em; text-transform: uppercase; opacity: 0; transition: opacity .5s ease;
  }
  .sub.on { opacity: 1; }

  .mark { position: absolute; right: 44px; bottom: 34px; z-index: 4; width: 150px; text-align: center; }
  .mark-glow { position: relative; width: 150px; height: 150px; isolation: isolate; }
  .mark-glow::before {
    content: ''; position: absolute; inset: -30%; z-index: -1; border-radius: 50%;
    background: radial-gradient(circle, rgba(127,211,255,.62) 0%, rgba(127,211,255,.20) 45%, transparent 72%);
    filter: blur(13px); animation: glow 5s ease-in-out infinite;
  }
  .mark img { display: block; width: 150px; height: auto; filter: drop-shadow(0 16px 40px rgba(0,0,0,.6)); }
  .mark b { display: block; margin-top: 10px; color: var(--muted); font: 500 8.5px/1.2 var(--mono); letter-spacing: .22em; text-transform: uppercase; }
  @keyframes glow {
    0%, 100% { opacity: .62; transform: scale(.96); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  .flash { position: absolute; inset: 0; z-index: 9; background: #FFFFFF; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="banner">
  <div class="copy">
    <p class="label">Glasswing / Field Division</p>
    <h1><span id="typed"></span><span class="cursor" id="cursor"></span></h1>
    <p class="sub" id="sub">The field storefront · Public portal A—02</p>
  </div>

  <div class="mark">
    <div class="mark-glow"><img src="glasswing-logo-reverse.png" alt="Oroboros / Anthropic"></div>
    <b>Glasswing</b>
  </div>

  <div class="flash" id="flash"></div>
</div>

<script>
(function () {
  var text = 'REALITY BROKERS';
  var typed = document.getElementById('typed');
  var cursor = document.getElementById('cursor');
  var sub = document.getElementById('sub');
  var flash = document.getElementById('flash');
  var markGlow = document.querySelector('.mark-glow');
  var start = 0;
  var TYPE_START = 0.35, TYPE_DUR = 1.35;
  var HOLD_END = 26.4, FLASH_DUR = 0.7, TOTAL = 27.4;

  function frame(now) {
    if (!start) start = now;
    var t = ((now - start) / 1000) % TOTAL;

    var p = Math.max(0, Math.min(1, (t - TYPE_START) / TYPE_DUR));
    var n = Math.floor(p * text.length);
    typed.textContent = text.slice(0, n);

    var typing = t > TYPE_START && t < TYPE_START + TYPE_DUR;
    var blink = Math.floor(t * 2) % 2 === 0;
    cursor.classList.toggle('on', typing || (t < HOLD_END && blink));
    sub.classList.toggle('on', t > TYPE_START + TYPE_DUR + 0.2);

    if (t > HOLD_END && t < HOLD_END + FLASH_DUR) {
      var f = (t - HOLD_END) / FLASH_DUR;
      flash.style.opacity = String(Math.sin(Math.PI * f) * 0.92);
      markGlow.style.opacity = '0';
    } else {
      flash.style.opacity = '0';
      markGlow.style.opacity = '1';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__setTime = function (seconds) {
    start = performance.now() - seconds * 1000;
    frame(performance.now());
  };
})();
</script>
</body>
</html>
