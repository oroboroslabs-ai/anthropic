<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Oroboros / Anthropic circular mark">
  <defs>
    <clipPath id="circleClip"><circle cx="500" cy="500" r="480"/></clipPath>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8C4D2"/>
      <stop offset=".42" stop-color="#E7ECF2"/>
      <stop offset=".64" stop-color="#AFBCCB"/>
      <stop offset="1" stop-color="#DDE4EC"/>
    </linearGradient>
  </defs>
  <circle cx="500" cy="500" r="480" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4"/>
  <g clip-path="url(#circleClip)">
    <g transform="translate(500 500) scale(1.9) translate(-300 -380)">
      <!-- The slash-A watermark: its bottom corners meet the Ouroboros circle -->
      <g fill="url(#wm)">
        <path d="M66.5,0H52.4l25.7,65h14.1L66.5,0z M25.7,0L0,65h14.4l5.3-13.6h26.9L51.8,65h14.4L40.5,0C40.5,0,25.7,0,25.7,0z M24.3,39.3l8.8-22.8l8.8,22.8H24.3z" transform="translate(300 382) scale(5) translate(-46.1 -32.5)"/>
        <path d="M62 606 L538 154" stroke="url(#wm)" stroke-width="54" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Black Ouroboros and reversed A -->
      <circle cx="300" cy="380" r="137.5" fill="none" stroke="#08080A" stroke-width="50" stroke-linecap="round" stroke-dasharray="690 96" transform="rotate(-73 300 380)"/>
      <g fill="#08080A" transform="translate(300 380) scale(-2.31 2.31) translate(-46.1 -32.5)">
        <path d="M66.5,0H52.4l25.7,65h14.1L66.5,0z M25.7,0L0,65h14.4l5.3-13.6h26.9L51.8,65h14.4L40.5,0C40.5,0,25.7,0,25.7,0z M24.3,39.3l8.8-22.8l8.8,22.8H24.3z"/>
      </g>
    </g>
  </g>
</svg>
