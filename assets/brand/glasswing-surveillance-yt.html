<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glasswing — Surveillance &amp; Counter-Surveillance Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050506; --ink: #F4F3EF; --ice: #D3E2EE;
    --w: 1920px; --h: 1080px;
    --cw: 1670px; --left: 125px;
    --fs: 396px; --fs2: 131px; --gap: 180px;
    --display: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: var(--w); height: var(--h); overflow: hidden; background: var(--bg); color: var(--ink); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  .banner {
    position: relative; width: var(--w); height: var(--h); overflow: hidden; isolation: isolate;
    background-color: #050506;
    background-image:
      radial-gradient(720px 600px at 76% 30%, rgba(200,220,235,.07), transparent 66%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: auto, 84px 84px, 84px 84px;
  }

  .shine {
    position: absolute; right: -40px; top: 50%; width: 52vw; height: 52vw; max-height: 92vh;
    transform: translateY(-50%); z-index: 1; pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,.16) 0%, rgba(211,226,238,.06) 34%, transparent 66%);
    filter: blur(8px);
  }
  .streak {
    position: absolute; right: 10%; top: 36%; width: 26vw; height: 1px; z-index: 2;
    transform: translateY(-50%) rotate(-8deg); transform-origin: right center;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    opacity: .5;
  }
  .star { position: absolute; right: 1.6%; top: 47%; width: calc(var(--w) * .029); height: calc(var(--w) * .029); z-index: 3; transform: translateY(-56%); color: #fff; filter: drop-shadow(0 0 14px rgba(127,211,255,.6)); opacity: .9; }
  .star img { display: block; width: 100%; height: 100%; }
  .sigil { position: absolute; left: 3.9%; top: 9.6%; width: calc(var(--w) * .0117); height: calc(var(--w) * .0117); z-index: 5; opacity: .8; }
  .sigil img { display: block; width: 100%; height: 100%; }

  .stack { position: absolute; left: var(--left); width: var(--cw); top: 50%; transform: translateY(-50%); z-index: 5; }
  h1 {
    margin: 0; font: 400 var(--fs)/.86 var(--display);
    letter-spacing: -.055em; text-transform: uppercase;
    color: var(--ink); white-space: nowrap; text-shadow: 0 30px 90px rgba(0,0,0,.5);
  }
  .label {
    margin: var(--gap) 0 0; color: #FFFFFF;
    font: 400 var(--fs2)/1 var(--display);
    letter-spacing: -.055em; word-spacing: 1.02ch; text-transform: uppercase; white-space: nowrap;
    text-shadow: 0 30px 90px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<div class="banner">
  <div class="shine"></div>
  <div class="streak"></div>
  <div class="star"><img src="reality-brokers-mark.svg" alt=""></div>
  <div class="sigil"><img src="reality-brokers-mark.svg" alt="Glasswing"></div>

  <div class="stack">
    <h1>Glasswing</h1>
    <p class="label">Surveillance and Counter Surveillance Platform</p>
  </div>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var W = +(q.get('w') || 1920), H = +(q.get('h') || 1080);
  var CW = +(q.get('cw') || Math.round(W * 0.87));
  var safeH = +(q.get('safeh') || 0);
  var root = document.documentElement;
  root.style.setProperty('--w', W + 'px');
  root.style.setProperty('--h', H + 'px');
  root.style.setProperty('--cw', CW + 'px');
  root.style.setProperty('--left', ((W - CW) / 2) + 'px');

  var label = document.querySelector('.label');
  // measure the descriptor text (not its block box) at 100px, then scale to the content width
  root.style.setProperty('--fs2', '100px');
  var range = document.createRange();
  range.selectNodeContents(label);
  var probe = range.getBoundingClientRect().width;
  var s = 100 * (CW / probe);            // small line size
  var big = s * (132 / 43.6);            // GLASSWING keeps the 132 : 43.6 banner ratio
  var block = big * 0.86 + big * (60 / 132) + s;
  var maxBlock = (safeH ? safeH * 0.95 : H * 0.84);
  if (block > maxBlock) {
    var k = maxBlock / block;
    big *= k; s *= k;
  }
  root.style.setProperty('--fs', big.toFixed(2) + 'px');
  root.style.setProperty('--fs2', s.toFixed(2) + 'px');
  root.style.setProperty('--gap', (big * (60 / 132)).toFixed(2) + 'px');
})();
</script>
</body>
</html>
